{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Matcher – Teacher Dashboard</title>
  <link rel="stylesheet" href="{% static 'css/teacher_dashboard.css' %}" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="site-header">
    <h1>
      <svg class="header-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34
          2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7
          3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84
          1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
      </svg>
      Team Matcher
    </h1>
  </header>

  <main class="dashboard-main">

    <!-- ── 1. Course & Team-Set Selection ──────────────────── -->
    <section class="card" id="section-selectors">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm1 17.93V18a1 1 0
            0 0-2 0v1.93A8.001 8.001 0 0 1 4.07 13H6a1 1 0 0 0 0-2H4.07A8.001
            8.001 0 0 1 11 4.07V6a1 1 0 0 0 2 0V4.07A8.001 8.001 0 0 1 19.93
            11H18a1 1 0 0 0 0 2h1.93A8.001 8.001 0 0 1 13 19.93z"/>
        </svg>
        Select Course &amp; Team Set
      </h2>

      <div class="selector-row">
        <!-- Team-Set dropdown — populated from /api/team-sets/ on load -->
        <div class="field-group">
          <label for="teamset-select">Team Set</label>
          <select id="teamset-select" name="team_set" class="select-input" disabled>
            <option value="" disabled selected>Loading…</option>
          </select>
        </div>
      </div>
    </section>

    <!-- ── 2. CSV Import ────────────────────────────────────── -->
    <section class="card" id="section-csv">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/>
        </svg>
        Upload CSV File
      </h2>

      <div class="upload-area" id="upload-area">
        <input type="file" id="csv-file-input" name="csv_file"
               accept=".csv" class="file-input-hidden" />
        <label for="csv-file-input" class="upload-label">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0
              2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/>
          </svg>
          <span id="upload-label-text">Datei auswählen &nbsp;·&nbsp; Keine Datei ausgewählt</span>
        </label>
      </div>
    </section>

    <!-- ── 3. Action Buttons ────────────────────────────────── -->
    <section class="card" id="section-actions">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94
            0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0
            .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.01
            7.01 0 0 0-1.62-.94l-.36-2.54A.484.484 0 0 0 14
            2h-4c-.25 0-.46.18-.49.42l-.36 2.54c-.59.24-1.13.57-1.62.94L5.14
            5c-.22-.08-.47 0-.59.22L2.63 8.54a.48.48 0 0 0 .12.61l2.03
            1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0
            0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.37 1.03.7
            1.62.94l.36 2.54c.05.24.26.42.49.42h4c.25 0 .46-.18.49-.42l.36-2.54c.59-.24
            1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0
            0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6
            3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
        Actions
      </h2>

      <!-- CSRF token for POST requests -->
      {% csrf_token %}

      <div class="action-row">
        <button type="button" class="btn btn-primary" id="btn-run-matching">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99
              3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55
              7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31
              0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69
              4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
          Run Matching
        </button>

        <button type="button" class="btn btn-secondary" id="btn-export-csv">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
          Export CSV
        </button>
      </div>
    </section>

    <!-- ── 4. Teams Display ─────────────────────────────────── -->
    <section class="card" id="section-teams">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66
            0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34
            2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3
            3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8
            0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97
            3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
        Generated Teams
      </h2>

      <!-- Team cards injected here by JavaScript -->
      <div class="teams-grid" id="teams-container">
        <p class="placeholder-text">No teams generated yet. Upload a CSV and run matching.</p>
      </div>
    </section>

    <!-- ── 5. Unassigned Students ───────────────────────────── -->
    <section class="card" id="section-unassigned">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12
            2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2
            0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
        Unassigned Students
      </h2>

      <!-- Unassigned student chips injected here by JavaScript -->
      <div class="unassigned-container" id="unassigned-container">
        <p class="placeholder-text">No unassigned students.</p>
      </div>
    </section>

  </main>

  <script src="{% static 'js/teacher_dashboard.js' %}"></script>
</body>
</html>
