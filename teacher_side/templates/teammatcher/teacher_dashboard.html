{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Matcher – Adjust Teams</title>
  <link rel="stylesheet" href="{% static 'css/teacher_dashboard.css' %}" />
</head>
<body>

  <header class="site-header">
    <h1>
      <svg class="header-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3
          3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34
          5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5
          -7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5
          c0-2.33-4.67-3.5-7-3.5z"/>
      </svg>
      Team Matcher
    </h1>
    <p class="site-subtitle">Manual Team Adjustment</p>
  </header>

  <main class="dashboard-main">

    <!-- ── Step 1: Load a generation ───────────────────────── -->
    <section class="card" id="section-load">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/>
        </svg>
        Load Teams
      </h2>

      <div class="load-row">
        <!-- Recent generations from DB -->
        <div class="field-group">
          <label for="generation-select">Recent Matching Result</label>
          <select id="generation-select" class="select-input">
            <option value="" disabled selected>— Choose a result —</option>
            {% for gen in generations %}
              <option value="{{ gen.id }}">
                Coding Camp Q2: {{ gen.generated_at|date:"d M Y, H:i" }} · {{ gen.student_count }} students
              </option>
            {% empty %}
              <option disabled>No results yet — run matching first</option>
            {% endfor %}
          </select>
        </div>

        <button type="button" class="btn btn-primary" id="btn-load">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
          Load
        </button>
      </div>

      <!-- Status bar shown after load -->
      <div class="load-status" id="load-status" hidden>
        <span id="status-text"></span>
        <span class="status-unsaved" id="status-unsaved" hidden>● Unsaved changes</span>
      </div>
    </section>

    <!-- ── Step 2: Adjust teams (drag & drop) ──────────────── -->
    <section class="card" id="section-teams" hidden>
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3
            1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8
            5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7
            3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05
            1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
        Adjust Teams
        <span class="card-hint">Drag students between teams to reassign</span>
      </h2>

      <div class="teams-grid" id="teams-container"></div>
    </section>

    <!-- ── Step 3: Export ───────────────────────────────────── -->
    <section class="card" id="section-export" hidden>
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        Export
      </h2>

      {% csrf_token %}

      <div class="action-row">
        <button type="button" class="btn btn-primary" id="btn-export">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
          Export CSV for LMS
        </button>

        <button type="button" class="btn btn-ghost" id="btn-reset">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69
              6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58
              8-8-3.58-8-8-8z"/>
          </svg>
          Reset Changes
        </button>
      </div>
    </section>

  </main>

  <script src="{% static 'js/teacher_dashboard.js' %}"></script>
</body>
</html>
